---
# Foundation inventory - used after bootstrap, before production
#
# Connection: Local IP address (may require local network access)
# User: ansible (automation user created during bootstrap)
#
# After foundation phase completes:
#   1. Get Tailscale hostname: tailscale status | grep <hostname>
#   2. Update hosts-production.yml to use Tailscale hostname
#   3. Switch to production phase using hosts-production.yml
#
# RULE: When adding a new host, copy from hosts-bootstrap.yml and change:
#       - ansible_user: armand → ansible_user: ansible
all:
  children:
    home_milkyway:
      children:
        x86:
          hosts:
            arcturus:
              # Proxmox host. Same LAN address as in hosts-bootstrap.yml.
              ansible_host: CHANGE_ME_LAN_IP
              ansible_user: ansible
        arcturus_vms:
          # VMs on arcturus. Same LAN addresses as in hosts-bootstrap.yml.
          hosts:
            megrez:
              ansible_host: CHANGE_ME_LAN_IP
              ansible_user: ansible
            phecda:
              ansible_host: CHANGE_ME_LAN_IP
              ansible_user: ansible
            dubhe:
              ansible_host: CHANGE_ME_LAN_IP
              ansible_user: ansible
            alioth:
              ansible_host: CHANGE_ME_LAN_IP
              ansible_user: ansible
            alkaid:
