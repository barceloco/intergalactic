              ansible_user: ansible
            merak:
              ansible_host: CHANGE_ME_LAN_IP
              ansible_user: ansible
            mizar:
              ansible_host: CHANGE_ME_LAN_IP
              ansible_user: ansible
            alcor:
              ansible_host: CHANGE_ME_LAN_IP
              ansible_user: ansible
        rpi5:
          hosts:
            vega:
              # Updated to use Tailscale hostname (vega is already on Tailscale)
              ansible_host: vega.tailb821ac.ts.net
