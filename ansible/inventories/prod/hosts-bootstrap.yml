---
# Bootstrap inventory - used for initial setup of new hosts
#
# CRITICAL: ALL hosts in this file MUST use ansible_user: armand
# This is the initial user that exists on fresh Raspberry Pi images
#
# After bootstrap completes, switch to using hosts-foundation.yml which uses the 'ansible' automation user
#
# RULE: When adding a new host, it MUST use ansible_user: armand in this file
#       and ansible_user: ansible in hosts-foundation.yml and hosts-production.yml
all:
  children:
    home_milkyway:
      children:
        x86:
          hosts:
            arcturus:
              # Proxmox host (HP Elite Mini 800 G9). Set its LAN address here
              # once Debian 13 is installed (see docs/runbooks/proxmox-arcturus.md).
              ansible_host: CHANGE_ME_LAN_IP
              ansible_user: armand
        arcturus_vms:
          # VMs on arcturus. Each address is the VM's address_cidr (without the
          # /prefix) from host_vars/arcturus.yml; cloud-init creates armand.
          hosts:
            megrez:
              ansible_host: CHANGE_ME_LAN_IP
              ansible_user: armand
            phecda:
              ansible_host: CHANGE_ME_LAN_IP
              ansible_user: armand
            dubhe:
              ansible_host: CHANGE_ME_LAN_IP
              ansible_user: armand
            alioth:
              ansible_host: CHANGE_ME_LAN_IP
              ansible_user: armand
            alkaid:
              ansible_host: CHANGE_ME_LAN_IP
              ansible_user: armand
            merak:
              ansible_host: CHANGE_ME_LAN_IP
              ansible_user: armand
            mizar:
              ansible_host: CHANGE_ME_LAN_IP
              ansible_user: armand
            alcor:
              ansible_host: CHANGE_ME_LAN_IP
              ansible_user: armand
        rpi5:
          hosts:
            vega:
              ansible_host: 192.168.1.243
              ansible_user: armand
        rpi4:
          hosts:
            rigel:
              ansible_host: 192.168.1.231
              ansible_user: armand
        rpi3:
          hosts:
            alpheratz:
              ansible_host: 192.168.1.232
              ansible_user: armand
        rpi1:
          hosts:
            saiph:
              ansible_host: 192.168.1.60
              ansible_user: armand
            deneb:
              ansible_host: 192.168.1.234
              ansible_user: armand
    andromeda_m31:
      children:
        rpi1:
          hosts:
            g1:
              ansible_host: 10.10.10.11
              ansible_user: armand
    triangulum_m33:
      children:
        rpi1:
          hosts:
