---
hostname: "rigel"
enable_desktop: false
enable_docker: true

# LUKS/cryptsetup: Installed for mounting external encrypted devices
# No configuration needed - cryptsetup is installed and ready to use

# Samba configuration
enable_samba: true
# Samba uses its own password database (smbpasswd)
# Password is set from samba_armand_passwords[inventory_hostname] in all_secrets.yml
# Set it to match the system password if you want to use the same password
# Future system password changes will sync to Samba automatically

# Docker deployment configuration
enable_docker_deploy: true
docker_deploy_tcp_ports:
  - 8000   # API
  - 8001   # API
  - 5432   # PostgreSQL
  - 6379   # Redis
  - 9000   # MinIO
  - 9001   # MinIO
  - 8023   # csa -> csa.exnada.com
  - 3000   # Grafana (observability) -> monitor.exnada.com
  - 9100   # node_exporter (Prometheus scrapes host + provenance metrics)
# Configure Docker to use CoreDNS for DNS resolution (so containers can resolve Tailscale hostnames)
docker_deploy_dns_servers:
  - 127.0.0.1  # CoreDNS (for Tailscale hostname resolution)
  - 8.8.8.8    # Fallback to Google DNS
# Per-repo Git SSH for the deploy user: each name <n> maps to on-host key
# ~deploy/.ssh/id_ed25519_<n> and SSH alias github-<n> (HostName github.com).
# The role prints each public key to register as a GitHub deploy key
# (unique per repo per host).
docker_deploy_git_repos:
  - aispector   # /srv/aispector -> git@github-aispector:exnada/aispector.git
  - callosal    # /srv/callosal  -> git@github-callosal:barceloco/callosal.git
  - csa         # /srv/csa       -> git@github-csa:exnada/csa.git

# csa service (app_csa role). Ansible pulls the repo, renders the gitignored
# .env with CSA_PORT (compose maps ${CSA_PORT:-8000}:8000), and runs docker
# compose up --build. The csa repo is pulled (read), never modified.
csa_enabled: true
csa_repo_ref: main   # branch to serve (see the Vega=prod / Rigel=dev convention in CLAUDE.md)
csa_env:
  CSA_PORT: "8023"   # deterministic: 8000 + C+S+A

# Observability stack (observability role): Prometheus + Grafana + blackbox on
# rigel, the control-plane host. Probes every edge route end-to-end and serves
# the Grafana admin page at monitor.exnada.com. Data lives in named volumes.
observability_enabled: true
observability_expect_existing_data: false   # first deploy creates the volumes; set true afterward

# node_exporter (host metrics + the textfile dir app roles write app_build_info
# provenance into, scraped by Prometheus).
node_exporter_enabled: true

# Internal DNS configuration
internal_dns_enabled: true
internal_dns_domain: exnada.com
# Hosts that need DNS entries but are NOT routed through Traefik.
# Routed hosts are auto-added from edge_ingress_routes below — do NOT list them here.
internal_dns_private_hosts:
  - mpnas      # DNS-only: resolves to mpnas's IP for direct access (SMB, etc.)
  - vega       # Resolves to vega's Tailscale IP (direct access)
  - rigel      # Resolves to rigel's Tailscale IP (direct access)

# =============================================================================
# REVERSE PROXY ROUTES (Traefik on rigel)
# =============================================================================
# To add a new HTTPS endpoint:
#   1. Add an entry below with host + backend
#   2. Run: ./scripts/run-ansible.sh prod rigel production
#   3. That's it. DNS and TLS certificates are handled automatically.
#
# Each entry creates:
#   - A Traefik HTTPS router with automatic Let's Encrypt certificate
#   - A CoreDNS record pointing <subdomain>.exnada.com to rigel
#
# Optional fields:
#   health_path: /health    — Traefik health-checks the backend at this path
# =============================================================================
edge_ingress_enabled: true
edge_ingress_domain: exnada.com
edge_ingress_acme_email: admin@exnada.com
edge_ingress_use_tailscale_fqdn: true
edge_ingress_disable_tls: false
edge_ingress_backend_timeout_connect: 30s
edge_ingress_backend_timeout_response: 60s
edge_ingress_routes:
  - host: aispector.exnada.com
    backend: http://vega:8000
    health_path: /health
  - host: callosal.exnada.com
    backend: "http://vega:{{ port_api_alt | default('8001') }}"
    health_path: /health
  - host: csa.exnada.com
    backend: http://rigel:8023
    health_path: /health
  - host: demo.exnada.com
    backend: "http://rigel:{{ port_api_alt | default('8001') }}"
    health_path: /health
  - host: dev.exnada.com
    backend: http://rigel:8000
    health_path: /health
  - host: docgen.exnada.com
    backend: http://vega:8048
  - host: immich.exnada.com
    backend: http://100.120.170.43:2283
  - host: monitor.exnada.com
    backend: http://rigel:3000
    health_path: /api/health
