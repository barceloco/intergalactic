---
hostname: "vega"
enable_desktop: true
enable_docker: true

# Override ssh_allow_users to include the deploy user (which owns /srv/callosal
# and /srv/docgen on vega). Deploy user already exists locally; we only need
# AllowUsers in sshd to permit SSH logins for service ops.
ssh_allow_users: "{{ [automation_user] + (human_users | default([]) | map(attribute='name') | list) + ['deploy'] }}"

# Per-repo Git SSH for the deploy user (adopts the existing on-host keys).
# vega does NOT run the full docker_deploy role (its /srv is a real directory;
# the role would bind-mount /home/deploy/srv over it). vega-production.yml
# imports only tasks_from: git_ssh from the role.
docker_deploy_git_repos:
  - aispector       # /srv/aispector      -> git@github-aispector:exnada/aispector.git
  - callosal        # /srv/callosal       -> git@github-callosal:barceloco/callosal.git
  - docgen          # /srv/docgen         -> git@github-docgen:exnada/docgen.git
  - docgen-exnada   # /srv/docgen-exnada  -> github-docgen-exnada:exnada/docgen-exnada.git

# docgen service (app_docgen role). Ansible drives the deployment lifecycle
# (repo ref, gitignored .env, docker compose up via docgen's own Makefile) but
# never touches docgen's data volumes (docgen_pgdata, docgen_doc_storage).
# DOCGEN_ADMINS (a Tailscale-IP allow-list) is kept in the gitignored
# all_secrets.yml as docgen_admins, so no IP lands in the committed repo.
docgen_enabled: true
docgen_repo_ref: main    # branch to serve; vega is the production server (see convention in CLAUDE.md)
docgen_brand_ref: main   # docgen-exnada brand repo branch
docgen_route: docgen.exnada.com   # domain this instance is served at (shown in provenance)

# callosal prod instance (callosal.exnada.com). vega is production, so it tracks
# main. dev was fast-forwarded into main on 2026-07-05, so main == dev's tip;
# rigel's demo.exnada.com stays the only dev-branch deployment in the fleet.
callosal_enabled: true
callosal_repo_ref: main
callosal_route: callosal.exnada.com   # domain this instance is served at (shown in provenance)

# aispector prod instance (aispector.exnada.com). Stateful stack. On main (the
# feature work was merged into main 2026-07-05); change + redeploy to switch.
aispector_enabled: true
aispector_repo_ref: main
aispector_route: aispector.exnada.com   # domain this instance is served at
docgen_env:
  DOCGEN_ADMINS: "{{ docgen_admins }}"
  DOCGEN_PORT: "8048"   # deterministic: 8000 + D+O+C+G+E+N (moved off 8420)

# node_exporter (host metrics + the textfile dir app_docgen writes app_build_info
# provenance into, scraped by Prometheus on rigel).
node_exporter_enabled: true

# LUKS/cryptsetup: Installed for mounting external encrypted devices
# No configuration needed - cryptsetup is installed and ready to use

# Samba configuration
enable_samba: true
# Samba uses its own password database (smbpasswd)
# Password is set from samba_armand_passwords[inventory_hostname] in all_secrets.yml
# Set it to match the system password if you want to use the same password
# Future system password changes will sync to Samba automatically

# Firewall configuration
# Allow ports for services running on vega. SSH is NOT here: it is opened via
# the Tailscale + LAN-subnet rules in the firewall template (see all.yml).
firewall_allow_tcp_ports:
  - 8000   # AISpector (port_api) → aispector.exnada.com
  - 8001   # Callosal (port_api_alt) → callosal.exnada.com
  - 8048   # Docgen → docgen.exnada.com (deterministic port; was 8420)
  - 9100   # node_exporter (Prometheus on rigel scrapes host + provenance metrics)
