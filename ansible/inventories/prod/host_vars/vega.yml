---
hostname: "vega"
enable_desktop: true
enable_docker: true

# Override ssh_allow_users to include the deploy user (which owns /srv/callosal
# and /srv/docgen on vega). Deploy user already exists locally; we only need
# AllowUsers in sshd to permit SSH logins for service ops.
ssh_allow_users: "{{ [automation_user] + (human_users | default([]) | map(attribute='name') | list) + ['deploy'] }}"

# LUKS/cryptsetup: Installed for mounting external encrypted devices
# No configuration needed - cryptsetup is installed and ready to use

# Samba configuration
enable_samba: true
# Samba uses its own password database (smbpasswd)
# Password is set from samba_armand_passwords[inventory_hostname] in all_secrets.yml
# Set it to match the system password if you want to use the same password
# Future system password changes will sync to Samba automatically

# Firewall configuration
# Allow ports for services running on vega
firewall_allow_tcp_ports:
  - "{{ ssh_port }}"
  - 8000   # AISpector (port_api) → aispector.exnada.com
  - 8001   # Callosal (port_api_alt) → callosal.exnada.com
  - 8420   # Docgen → docgen.exnada.com
