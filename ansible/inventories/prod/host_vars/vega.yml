---
hostname: "vega"
enable_desktop: true
enable_docker: true

# Override ssh_allow_users to include the deploy user (which owns /srv/callosal
# and /srv/docgen on vega). Deploy user already exists locally; we only need
# AllowUsers in sshd to permit SSH logins for service ops.
ssh_allow_users: "{{ [automation_user] + (human_users | default([]) | map(attribute='name') | list) + ['deploy'] }}"

# Per-repo Git SSH for the deploy user (adopts the existing on-host keys).
# vega does NOT run the full docker_deploy role (its /srv is a real directory;
# the role would bind-mount /home/deploy/srv over it). vega-production.yml
# imports only tasks_from: git_ssh from the role.
docker_deploy_git_repos:
  - aispector       # /srv/aispector      -> git@github-aispector:exnada/aispector.git
  - callosal        # /srv/callosal       -> git@github-callosal:barceloco/callosal.git
  - docgen          # /srv/docgen         -> git@github-docgen:exnada/docgen.git
  - docgen-exnada   # /srv/docgen-exnada  -> github-docgen-exnada:exnada/docgen-exnada.git

# docgen service (app_docgen role). Ansible drives the deployment lifecycle
# (repo ref, gitignored .env, docker compose up via docgen's own Makefile) but
# never touches docgen's data volumes (docgen_pgdata, docgen_doc_storage).
# DOCGEN_ADMINS (a Tailscale-IP allow-list) is kept in the gitignored
# all_secrets.yml as docgen_admins, so no IP lands in the committed repo.
docgen_enabled: true
docgen_repo_ref: main    # branch to serve; vega is the production server (see convention in CLAUDE.md)
docgen_brand_ref: main   # docgen-exnada brand repo branch

# callosal prod instance (callosal.exnada.com). vega is production, so it tracks
# main. dev was fast-forwarded into main on 2026-07-05, so main == dev's tip;
# rigel's demo.exnada.com stays the only dev-branch deployment in the fleet.
callosal_enabled: true
callosal_repo_ref: main

# aispector prod instance (aispector.exnada.com). Stateful stack. On main (the
# feature work was merged into main 2026-07-05); change + redeploy to switch.
aispector_enabled: true
aispector_repo_ref: main
docgen_env:
  DOCGEN_ADMINS: "{{ docgen_admins }}"
  DOCGEN_PORT: "8048"   # deterministic: 8000 + D+O+C+G+E+N (moved off 8420)

# LUKS/cryptsetup: Installed for mounting external encrypted devices
# No configuration needed - cryptsetup is installed and ready to use

# Samba configuration
enable_samba: true
# Samba uses its own password database (smbpasswd)
# Password is set from samba_armand_passwords[inventory_hostname] in all_secrets.yml
# Set it to match the system password if you want to use the same password
# Future system password changes will sync to Samba automatically

# Firewall: everything not listed here is dropped, from every source (SSH and
# ping are built in; see group_vars/all.yml). The app backends are reached only
# by Traefik on rigel, so only rigel's Tailscale address is admitted.
firewall_rules:
  - port: 8000
    from: [rigel]
    comment: "AISpector (port_api) backend for Traefik on rigel -> aispector.exnada.com"
  - port: 8001
    from: [rigel]
    comment: "Callosal (port_api_alt) backend for Traefik on rigel -> callosal.exnada.com"
  - port: 8048
    from: [rigel]
    comment: "Docgen backend for Traefik on rigel -> docgen.exnada.com"
  - port: 8148
    from: [rigel]
    comment: "Gatus status page for Traefik on rigel -> status.exnada.com"
  - port: 3070
    from: [rigel]
    comment: "Homepage dashboard for Traefik on rigel -> home.exnada.com"
  - port: [139, 445]
    from: [tailnet, lan]
    comment: "Samba (SMB)"
  - port: [137, 138]
    proto: udp
    from: [tailnet, lan]
    comment: "Samba (NetBIOS name and datagram service)"

# Alerts (roles notify + host_alerts): pushes via ntfy (topic in
# all_secrets.yml), login/sudo tripwires, health and integrity checks, dead-man
# ping. Operator addresses and the Healthchecks.io URL are in all_secrets.yml.
notify_enabled: true
notify_boot_message: true
host_alerts_enabled: true
host_alerts_smart: true    # NVMe and the external 6 TB drives

# Gatus (role app_gatus): the fleet's one uptime monitor, here so it survives
# rigel dying. Checks every route in rigel's edge_ingress_routes through
# rigel's DNS and Traefik, plus the DNS answers below; alerts via ntfy; status
# page at status.exnada.com (route on rigel, firewall rule above).
gatus_enabled: true
gatus_image_tag: "v5.38.0"   # 2026-10-28; https://github.com/TwiN/gatus/releases
gatus_image_digest: "sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415"
gatus_internal_dns_checks:
  docgen.exnada.com: "{{ fleet_tailscale_ipv4.rigel }}"   # routed names point at rigel
  vega.exnada.com: "{{ fleet_tailscale_ipv4.vega }}"
  mpnas.exnada.com: 100.120.170.43
gatus_public_dns_checks:
  - {name: exnada.com, type: NS, pattern: "*.domaincontrol.com."}   # GoDaddy
  - {name: exnada.com, type: MX, pattern: "*.mail.protection.outlook.com."}
  - {name: exnada.com, type: A, pattern: "217.21.77.108"}

# Daily check of the fleet's pinned images (role image_watch): urgent push for
# a published advisory affecting a pinned version, low push for a new release.
image_watch_enabled: true

# Homepage (role app_homepage): fleet dashboard at home.exnada.com (route on
# rigel, firewall rule above). App tiles come from rigel's edge_ingress_routes.
homepage_enabled: true
homepage_image_tag: "v2.8.0"   # 2026-11-11; https://github.com/gethomepage/homepage/releases
homepage_image_digest: "sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18"
homepage_hosts:
  - {name: rigel, address: "{{ fleet_tailscale_ipv4.rigel }}", description: "edge (CoreDNS, Traefik), dev apps"}
  - {name: vega, address: "{{ fleet_tailscale_ipv4.vega }}", description: "production apps, Gatus, Homepage, Samba"}
  - {name: mpnas, address: 100.120.170.43, description: "Synology NAS (SMB, Immich)"}
