---
- name: Rigel Production (Application Services)
  hosts: rigel
  become: true
  gather_facts: false
  vars_files:
    - "../inventories/prod/group_vars/all_secrets.yml"
  tags:
    - production
  pre_tasks:
    # Host key verification MUST be first - before any connection attempts
    - name: Import host key verification tasks
      import_tasks: shared/host-key-verification.yml
      tags: always

    # Import shared production validation (Tailscale verification)
    - name: Import production validation tasks
      import_tasks: shared/production-validation.yml
      tags: always
  roles:
    # 0. Alerts first: fleet-notify (push via ntfy), then the login, health and
    # integrity tripwires that report through it. Deployable on their own with
    # --tags notify,host_alerts.
    - role: notify
      tags: [production, notify]
    - role: host_alerts
      tags: [production, host_alerts]

    # 1. Docker deploy user and directory structure (must be first)
    - role: docker_deploy
      tags: [production, services]

    # 1a. csa application service. After docker_deploy so the deploy user's
    # github-csa SSH alias/key exist before the csa repo is pulled.
    - role: app_csa
      tags: [production, services, csa]

    # 1b. callosal application service (demo.exnada.com). After docker_deploy so
    # the deploy user's github-callosal SSH alias/key exist before the pull.
    - role: app_callosal
      tags: [production, services, callosal]

    # 1c. mpd (exnada/mpd). After docker_deploy, for the github-mpd SSH alias.
    - role: app_mpd
      tags: [production, services, mpd]

    # (no aispector on rigel right now -- only vega runs aispector; see host_vars)

    # 2. Internal DNS (CoreDNS) - must be available for certificate validation
    - role: internal_dns
      tags: [production, services, dns]

    # 3. Edge ingress (Traefik) - includes built-in ACME certificate management
    # Note: cert_issuer role is disabled - using Traefik's built-in ACME instead
    - role: edge_ingress
      tags: [production, services, edge]

    # 4. Certificate issuer (lego) - DISABLED by default, using Traefik ACME
    # Uncomment and enable cert_issuer_enabled in host_vars if you prefer lego
    # - role: cert_issuer
    #   tags: [production, services, certificates]

    # 5. Monitoring tools
    - role: monitoring_docker
      tags: [production, monitoring]

    # 6. LUKS support for external encrypted devices
    - role: luks
      tags: [production, security]

    # 7. Samba file share (armand -> /crypt). Reachable from the tailnet and
    # the LAN via firewall_rules in host_vars.
    - role: samba
      tags: [production, services, samba]
