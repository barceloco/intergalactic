---
- name: Rigel Production (Application Services)
  hosts: rigel
  become: true
  gather_facts: false
  vars_files:
    - "../inventories/prod/group_vars/all_secrets.yml"
  tags:
    - production
  pre_tasks:
    # Host key verification MUST be first - before any connection attempts
    - name: Import host key verification tasks
      import_tasks: shared/host-key-verification.yml
      tags: always

    # Import shared production validation (Tailscale verification)
    - name: Import production validation tasks
      import_tasks: shared/production-validation.yml
      tags: always
  roles:
    # 1. Docker deploy user and directory structure (must be first)
    - role: docker_deploy
      tags: [production, services]

    # 1a. node_exporter: host metrics plus the textfile dir that app roles write
    # deployment provenance (app_build_info) into. Before the app roles so the
    # directory exists when they write.
    - role: node_exporter
      tags: [production, monitoring]

    # 1b. csa application service. After docker_deploy so the deploy user's
    # github-csa SSH alias/key exist before the csa repo is pulled.
    - role: app_csa
      tags: [production, services, csa]

    # 2. Internal DNS (CoreDNS) - must be available for certificate validation
    - role: internal_dns
      tags: [production, services]

    # 3. Edge ingress (Traefik) - includes built-in ACME certificate management
    # Note: cert_issuer role is disabled - using Traefik's built-in ACME instead
    - role: edge_ingress
      tags: [production, services]

    # 4. Certificate issuer (lego) - DISABLED by default, using Traefik ACME
    # Uncomment and enable cert_issuer_enabled in host_vars if you prefer lego
    # - role: cert_issuer
    #   tags: [production, services, certificates]

    # 5. Monitoring tools
    - role: monitoring_docker
      tags: [production, monitoring]

    # 5b. Observability stack (Prometheus + Grafana + blackbox). Probes every
    # edge route end-to-end and serves the Grafana admin page via Traefik.
    - role: observability
      tags: [production, monitoring, observability]

    # 6. LUKS support for external encrypted devices
    - role: luks
      tags: [production, security]
