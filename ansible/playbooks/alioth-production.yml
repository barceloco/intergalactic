---
# Media: Jellyfin, Audiobookshelf, Navidrome
# Runs over Tailscale only, as the ansible user, like every production phase.
- name: "Alioth Production (Media: Jellyfin, Audiobookshelf, Navidrome)"
  hosts: alioth
  become: true
  gather_facts: false
  vars_files:
    - "../inventories/prod/group_vars/all_secrets.yml"
  tags:
    - production
  pre_tasks:
    # Host key verification MUST be first - before any connection attempts
    - name: Import host key verification tasks
      import_tasks: shared/host-key-verification.yml
      tags: always

    # Import shared production validation (Tailscale verification)
    - name: Import production validation tasks
      import_tasks: shared/production-validation.yml
      tags: always
  roles:
    # Alerts (fleet-notify) first: later roles' checks report through it.
    - role: notify
      tags: [production, notify]

    - role: docker_deploy
      tags: [production, services]

    - role: virtiofs_mounts
      tags: [production, storage]

    - role: app_jellyfin
      tags: [production, services, jellyfin]

    - role: app_audiobookshelf
      tags: [production, services, audiobookshelf]

    - role: app_navidrome
      tags: [production, services, navidrome]

    - role: monitoring_docker
      tags: [production, monitoring]
