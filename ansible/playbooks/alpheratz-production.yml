---
- name: Alpheratz Production (Application Services)
  hosts: alpheratz
  become: true
  gather_facts: false
  vars_files:
    - "../inventories/prod/group_vars/all_secrets.yml"
  tags:
    - production
    - always
  pre_tasks:
    # Host key verification MUST be first - before any connection attempts
    - name: Import host key verification tasks
      import_tasks: shared/host-key-verification.yml
      tags: always

    # Import shared production validation (Tailscale verification)
    - name: Import production validation tasks
      import_tasks: shared/production-validation.yml
      tags: always
  roles:
    - role: luks
      tags: [production, security]
