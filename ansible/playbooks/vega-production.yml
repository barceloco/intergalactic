---
- name: Vega Production (Application Services + Desktop)
  hosts: vega
  become: true
  gather_facts: false
  vars_files:
    - "../inventories/prod/group_vars/all_secrets.yml"
  tags:
    - production
  pre_tasks:
    # Host key verification MUST be first - before any connection attempts
    - name: Import host key verification tasks
      import_tasks: shared/host-key-verification.yml
      tags: always

    # Import shared production validation (Tailscale verification)
    - name: Import production validation tasks
      import_tasks: shared/production-validation.yml
      tags: always
  roles:
    - role: monitoring_docker
      tags: [production, monitoring]
    - role: luks
      tags: [production, security]
    - role: desktop
      tags: [production, desktop]
    - role: samba
      tags: [production, services]
  tasks:
    # Per-repo Git SSH for the hand-provisioned deploy user. Deliberately NOT
    # the full docker_deploy role: vega's /srv is a real directory holding the
    # app repos, and the full role would bind-mount /home/deploy/srv over it.
    - name: Configure per-repo Git SSH for deploy user
      import_role:
        name: docker_deploy
        tasks_from: git_ssh
      tags: [production, services]

    # docgen service. Runs after git_ssh so the deploy user's SSH aliases exist
    # before its repos are pulled. Manages docgen's lifecycle only, never its
    # data volumes; the docgen/docgen-exnada repos are pulled (read), not changed.
    - name: Deploy docgen service
      import_role:
        name: app_docgen
      tags: [production, services, docgen]
