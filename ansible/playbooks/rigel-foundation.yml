---
- name: Rigel Foundation (Network + Security + Base Infrastructure)
  hosts: rigel
  become: true
  gather_facts: false
  vars_files:
    - "../inventories/prod/group_vars/all_secrets.yml"
  tags:
    - foundation
    - always
  pre_tasks:
    - name: Import host key verification tasks
      import_tasks: shared/host-key-verification.yml
  roles:
    - role: common
      tags: [foundation, base]
    - role: ssh_hardening
      tags: [foundation, security]
    - role: firewall_nftables
      tags: [foundation, security]
    - role: fail2ban
      tags: [foundation, security]
    - role: updates
      tags: [foundation, base]
    - role: tailscale
      tags: [foundation, network]
    - role: docker_host
      tags: [foundation, infrastructure]
    - role: monitoring_base
      tags: [foundation, monitoring]
  post_tasks:
    - name: Get Tailscale hostname for next steps
      command: tailscale status --json
      register: tailscale_status_json
      changed_when: false
      failed_when: false
      delegate_to: rigel
      when: enable_tailscale | default(false)

    - name: Extract Tailscale hostname and IP
      set_fact:
        tailscale_hostname: "{{ (tailscale_status_json.stdout | from_json).Self.DNSName | default('') }}"
        tailscale_ip: "{{ (tailscale_status_json.stdout | from_json).Self.TailscaleIPs[0] | default('') }}"
      when:
        - enable_tailscale | default(false)
        - tailscale_status_json.stdout is defined

    - name: Display foundation completion and next steps
      debug:
        msg: |
          ============================================================================
          ✓ Foundation phase completed successfully!
          ============================================================================
          The host is now on the Tailscale network.

          {% if tailscale_hostname is defined and tailscale_hostname | length > 0 %}
          Tailscale hostname: {{ tailscale_hostname }}
          {% endif %}
          {% if tailscale_ip is defined and tailscale_ip | length > 0 %}
          Tailscale IP:       {{ tailscale_ip }}
          {% else %}
          To get Tailscale IP, run: tailscale ip -4
          {% endif %}

          ⚠️  IMPORTANT: Update Tailscale DNS Configuration
          ============================================================================
          If this host runs CoreDNS (internal_dns_enabled: true), you MUST update
          your Tailscale split DNS configuration to use the NEW Tailscale IP:

          1. Go to: https://login.tailscale.com/admin/dns
          2. Delete any old nameserver configuration for {{ inventory_hostname }}
          3. Add/update split DNS nameserver:
             - Domain: {{ internal_dns_domain | default('exnada.com') }}
             - Nameserver: {{ tailscale_ip | default('[Tailscale IP from above]') }}

          This prevents DNS resolution failures when the host gets a new Tailscale IP.
          ============================================================================

          Next steps:
          1. Update hosts-production.yml to use Tailscale hostname:
             {{ inventory_hostname }}:
               ansible_host: {{ tailscale_hostname | default(inventory_hostname + '.tailb821ac.ts.net') }}
               ansible_user: ansible

          2. Run production phase:
             ./scripts/run-ansible.sh prod {{ inventory_hostname }} production

          ============================================================================
      delegate_to: localhost
      run_once: true
