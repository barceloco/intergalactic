---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    # Debian 13 (trixie), matching the fleet, so the test uses the same
    # unattended-upgrades version and packaged configuration the hosts run.
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    privileged: true
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
provisioner:
  name: ansible
  inventory:
    host_vars:
      instance:
        ansible_python_interpreter: /usr/bin/python3
        enable_unattended_upgrades: true
        enable_tailscale: true
verifier:
  name: ansible
