---
- name: Converge
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: docker_host
      vars:
        enable_docker: true
    # tailscale role omitted: enable_tailscale is false and final_tailnet_name
    # is supplied below, so no tailscale up / status is needed. Real secrets are
    # not loaded; mock ACME credentials are set in molecule.yml host_vars.
    - role: edge_ingress
      vars:
        final_tailnet_name: "test-tailnet.ts.net"
