---
edge_ingress_domain: exnada.com
edge_ingress_acme_email: admin@exnada.com
edge_ingress_acme_staging: false            # Set to true for Let's Encrypt staging certificates (testing only)
edge_ingress_acme_delay_before_check: 180  # Delay before checking DNS propagation (seconds) - GoDaddy can be slow
edge_ingress_acme_propagation_timeout: 300  # Maximum time to wait for DNS propagation (seconds)
edge_ingress_acme_polling_interval: 10      # How often to check DNS propagation (seconds)
edge_ingress_acme_dns_ttl: 600              # TTL for ACME challenge TXT records (seconds)
edge_ingress_use_tailscale_fqdn: true
edge_ingress_tailnet_name: ""
edge_ingress_backend_timeout_connect: 30s
edge_ingress_backend_timeout_response: 60s
edge_ingress_health_check_interval: 10s
edge_ingress_health_check_timeout: 3s
edge_ingress_health_check_failure_threshold: 3
edge_ingress_container_name: traefik
# Pinned image (multi-arch index digest). Read the upgrade notes before
# changing: https://doc.traefik.io/traefik/migrate/v3/ and run
# ./scripts/test-traefik-config.sh, which starts this image on the rendered
# configuration. A changed image restarts Traefik once (pulled first).
edge_ingress_image: traefik
edge_ingress_image_tag: "v3.7.20"   # 2026-11-23
edge_ingress_image_digest: "sha256:8301d6f60957a422f98918aacf2b01482abde3e74ead3719aabdb7c64045fe28"
edge_ingress_data_dir: /opt/traefik
# Traefik's file provider watches this directory (mounted at /dynamic). It
# holds dynamic.yml only: every .yml/.yaml/.toml in it is loaded. A directory,
# not a single-file mount, so a changed route reloads live without a restart.
edge_ingress_dynamic_dir: "{{ edge_ingress_data_dir }}/dynamic"

# Gate after every run: each route must answer on this host through Traefik
# (SNI, certificate verified) and carry the X-Edge-Config fingerprint of the
# dynamic.yml just written, which proves Traefik serves the new config.
edge_ingress_gate_enabled: true
edge_ingress_gate_verify_tls: "{{ not (edge_ingress_acme_staging | bool) and not (edge_ingress_disable_tls | bool) }}"
# false: a backend answering 502/503/504 is a warning (the route itself works);
# true: it fails the play.
edge_ingress_gate_strict_backends: false
# Start and gate the service. Off only in molecule: Traefik cannot start under
# the test container's nested systemd, so the test stops after rendering.
edge_ingress_manage_service: true
# Before a restart, check Docker and the internet (the unit waits for both
# indefinitely).
edge_ingress_preflight_enabled: true
# Drill only: renders an unparsable dynamic.yml to prove that Traefik keeps the
# old routes, the gate catches it, and the previous file is restored.
edge_ingress_drill_invalid_dynamic: false
edge_ingress_disable_tls: false  # Set to true to disable TLS (for testing only - not recommended for production)
edge_ingress_routes: []
  # Example:
  # - host: mpnas.exnada.com
  #   backend: http://mpnas:5000
  #   health_path: /health
