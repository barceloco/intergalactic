---
# Deploy/run csa via its own docker compose. Runs as the deploy user, who owns
# /srv/csa and is in the docker group. The csa repo is only pulled (read), never
# modified. csa has no named data volumes, so nothing is guarded here.
- name: Check the deploy user exists (created by docker_deploy)
  when: csa_enabled | default(false)
  become: true
  command: id deploy
  register: csa_deploy_user
  changed_when: false
  failed_when: false

- name: Fail with guidance if the deploy user is missing
  when: csa_enabled | default(false)
  assert:
    that:
      - csa_deploy_user.rc == 0
    fail_msg: |
      ============================================================================
      ERROR: the 'deploy' user does not exist.
      ============================================================================
      The csa role runs as the 'deploy' user, created by the docker_deploy role.
      Set enable_docker_deploy: true for this host and ensure the production
      deploy runs docker_deploy first (it is ordered before app roles in the
      production playbook).
      ============================================================================
    success_msg: "✓ deploy user present"

- name: Deploy csa service
  when: csa_enabled | default(false)
  become: true
  become_user: deploy
  block:
    - name: Ensure csa repo present at the configured ref (pull only)
      git:
        repo: "{{ csa_repo_url }}"
        dest: "{{ csa_dir }}"
        version: "{{ csa_repo_ref }}"
        update: true
      register: csa_repo

    - name: Capture the git tag at the deployed csa commit (if any)  # noqa: command-instead-of-module
      command: git tag --points-at {{ csa_repo.after }}
      args:
        chdir: "{{ csa_dir }}"
      register: csa_tag
      changed_when: false
      # git tag --points-at has no git-module equivalent, hence command. Empty
      # when the commit carries no tag; surfaced as the tag label in
      # app_build_info so the dashboard shows a release tag when one exists.

    - name: Render csa .env (gitignored; sets CSA_PORT for the compose port mapping)
      template:
        src: csa.env.j2
        dest: "{{ csa_dir }}/.env"
        mode: '0640'
      register: csa_env_file

    - name: Render csa compose override (restart policy; kept outside the checkout)
      template:
        src: csa.override.yml.j2
        dest: "{{ csa_override_file }}"
        mode: '0640'
      register: csa_override

    - name: Build csa image (only when the checked-out code changed)
      command: docker compose -f compose.yaml -f {{ csa_override_file }} build
      args:
        chdir: "{{ csa_dir }}"
      when: csa_repo.changed
      changed_when: true
      # Building the Python image on a Pi is slow; only rebuild on an actual code
      # change. `up` below still builds on first deploy if the image is missing.

    - name: Start csa (docker compose up -d; recreates only on change)
      command: docker compose -f compose.yaml -f {{ csa_override_file }} up -d
      args:
        chdir: "{{ csa_dir }}"
      register: csa_up
      changed_when: >-
        'Recreat' in (csa_up.stdout + csa_up.stderr)
        or 'Creat' in (csa_up.stdout + csa_up.stderr)
        or 'Start' in (csa_up.stdout + csa_up.stderr)
      # csa's own compose.yaml plus the ansible restart-policy override; only the
      # csa service starts (the web tooling service is gated behind a profile).

    - name: Wait for csa to answer on /health
      uri:
        url: "http://127.0.0.1:{{ csa_port }}/health"
        status_code: [200]
      register: csa_health
      retries: 30
      delay: 5
      until: csa_health.status is defined and csa_health.status == 200
      # Generous retries: a fresh build plus uvicorn startup on a Pi is slow.

- name: Publish csa deployment provenance (app_build_info for Prometheus)
  when:
    - csa_enabled | default(false)
    - node_exporter_enabled | default(false)
    - csa_repo.after is defined
  become: true
  copy:
    dest: "{{ node_exporter_textfile_dir | default('/var/lib/prometheus/node-exporter') }}/csa.prom"
    mode: '0644'
    content: |
      # HELP app_build_info Repo, branch, and commit ansible deployed per app.
      # TYPE app_build_info gauge
      app_build_info{app="csa",repo="{{ csa_repo_url | regex_replace('\.git$', '') | regex_replace('^https?://[^/]+/', '') | regex_replace('^[^@/]+@[^:/]+:', '') }}",branch="{{ csa_repo_ref }}",commit="{{ csa_repo.after }}",tag="{{ (csa_tag.stdout_lines | first | default('')) if csa_tag is defined else '' }}"} 1
  # Runs as root (outside the deploy block) so it can write node_exporter's
  # textfile dir; the running commit then surfaces in Prometheus/Grafana. Skipped
  # where node_exporter is not deployed.
