---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    # Debian 13 (trixie), matching the fleet, so the test exercises the same
    # fail2ban version and config parser the hosts run.
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    privileged: true
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
provisioner:
  name: ansible
  inventory:
    host_vars:
      instance:
        ansible_python_interpreter: /usr/bin/python3
        enable_fail2ban: true
        fail2ban_maxretry: 5
        fail2ban_bantime_seconds: 315360000
        ssh_port: 22
verifier:
  name: ansible
