---
# Validate before touching the host, so a bad rule never half-applies.
- name: Validate firewall variables
  include_tasks: validate.yml

- name: Install nftables
  apt:
    name: nftables
    state: present
    update_cache: true

- name: Deploy nftables rules (syntax-checked before they replace the old file)
  template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Enable and start nftables
  service:
    name: nftables
    enabled: true
    state: started
