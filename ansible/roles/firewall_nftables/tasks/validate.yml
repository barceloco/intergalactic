---
# The old variables opened ports to every source on every interface. Refuse
# them loudly instead of silently ignoring them, so no host keeps a stale
# "open" it thinks it has, and none loses a port it relies on without notice.
- name: Refuse the retired all-sources port variables
  assert:
    that:
      - firewall_allow_tcp_ports is not defined or firewall_allow_tcp_ports | length == 0
      - firewall_allow_udp_ports is not defined or firewall_allow_udp_ports | length == 0
      - docker_deploy_tcp_ports is not defined or docker_deploy_tcp_ports | length == 0
      - firewall_local_ssh_subnet is not defined
    fail_msg: >-
      firewall_allow_tcp_ports, firewall_allow_udp_ports, docker_deploy_tcp_ports
      and firewall_local_ssh_subnet are retired: they opened ports to all sources.
      Move each port to firewall_rules with an explicit source list
      (see roles/firewall_nftables/defaults/main.yml), and rename
      firewall_local_ssh_subnet to firewall_lan_subnet.
    quiet: true

- name: Require the LAN subnet (SSH from the LAN is the lockout backup)
  assert:
    that:
      - firewall_lan_subnet is string
      - firewall_lan_subnet is match('^(\d{1,3}\.){3}\d{1,3}/(8|1[0-9]|2[0-9]|3[0-2])$')
    fail_msg: "firewall_lan_subnet must be an IPv4 network such as 192.168.1.0/24"
    quiet: true

- name: Validate each firewall rule
  assert:
    that:
      - rule.comment is defined and rule.comment | length > 0
      - rule.proto | default('tcp') in ['tcp', 'udp']
      - rule.from is defined and rule.from is iterable and rule.from is not string and rule.from | length > 0
      - (rule.port is iterable and rule.port is not string) or rule.port | int > 0
      - _ports | map('int') | select('gt', 0) | select('lt', 65536) | list | length == _ports | length
      - _ports | map('int') | select('eq', ssh_port | default(22) | int) | list | length == 0
      - rule.from | reject('in', ['tailnet', 'lan'] + (fleet_tailscale_ipv4 | list)) | list | length == 0
      - rule.from | reject('in', ['lan']) | list | length == 0 or enable_tailscale | default(false)
    fail_msg: >-
      Invalid firewall rule {{ rule }}. Each rule needs a comment, proto tcp or
      udp, ports 1-65535 (not the SSH port, which is built in), and a non-empty
      'from' list of "tailnet", "lan", or a host in fleet_tailscale_ipv4
      ({{ fleet_tailscale_ipv4 | list }}). Tailscale sources need enable_tailscale.
    quiet: true
  vars:
    _ports: "{{ rule.port if (rule.port is iterable and rule.port is not string) else [rule.port] }}"
  loop: "{{ firewall_rules }}"
  loop_control:
    loop_var: rule
    label: "{{ rule.comment | default(rule) }}"

- name: Validate fleet Tailscale addresses
  assert:
    that:
      # Tailscale CGNAT range 100.64.0.0/10: second octet 64-127.
      - item.value is match('^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.\d{1,3}\.\d{1,3}$')
    fail_msg: "fleet_tailscale_ipv4.{{ item.key }} must be a Tailscale (100.64.0.0/10) IPv4 address"
    quiet: true
  loop: "{{ fleet_tailscale_ipv4 | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
