---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    # Debian 13 (trixie), matching the fleet's nftables version.
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    privileged: true
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
provisioner:
  name: ansible
  inventory:
    host_vars:
      instance:
        ansible_python_interpreter: /usr/bin/python3
        ssh_port: 22
        # Shaped like vega: Tailscale + Docker, app backends admitted from
        # rigel only, Samba from the tailnet and the LAN. verify.yml builds a
        # fake tailnet, LAN and published container, and sends real traffic.
        enable_tailscale: true
        enable_docker: true
        firewall_lan_subnet: "192.168.1.0/24"
        fleet_tailscale_ipv4:
          rigel: 100.115.218.7
        firewall_rules:
          - port: 8000
            from: [rigel]
            comment: "app backend for Traefik on rigel"
          - port: 8048
            from: [rigel]
            comment: "published container port for Traefik on rigel"
          - port: 9100
            from: [rigel]
            comment: "node_exporter for Prometheus on rigel"
          - port: [139, 445]
            from: [tailnet, lan]
            comment: "Samba (SMB)"
          - port: [137, 138]
            proto: udp
            from: [tailnet, lan]
            comment: "Samba (NetBIOS)"
verifier:
  name: ansible
