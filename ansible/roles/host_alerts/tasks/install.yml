---
- name: Validate the host_alerts settings
  assert:
    that:
      - notify_enabled | default(false)
      - host_alerts_operator_sources | length > 0
      # IPv4 or IPv6 literals only (no names: the journal shows addresses).
      - host_alerts_operator_sources | reject('match', '^(([0-9]{1,3}\.){3}[0-9]{1,3}|[0-9A-Fa-f:]+)$') | list | length == 0
      - >-
        not (host_alerts_require_deadman | bool)
        or (host_alerts_healthchecks_urls[inventory_hostname] | default('')) is match('^https://[^/]+/')
    fail_msg: |
      ============================================================================
      ERROR: host_alerts is enabled but not configured.
      ============================================================================
      - notify_enabled must be true on this host (alerts go through fleet-notify).
      - Set in all_secrets.yml (never in host_vars):
          host_alerts_operator_sources: ["<your Mac's Tailscale IP>"]
          host_alerts_healthchecks_urls:
            {{ inventory_hostname }}: "https://hc-ping.com/<uuid>"
        (create one check per host at healthchecks.io: period 5 min, grace 10 min)
        or set host_alerts_require_deadman: false to run without the dead-man ping.
      ============================================================================
    success_msg: "host_alerts settings present"
    quiet: true

- name: Install the tools the alert scripts use
  apt:
    name: [jq, curl, util-linux]
    state: present

- name: Install the alert scripts
  copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: [host-alerts-follow, host-alerts-check]
  notify: Restart host-alerts-follow

- name: Write the host_alerts configuration (root only)
  template:
    src: host-alerts.conf.j2
    dest: "{{ host_alerts_conf_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart host-alerts-follow

- name: Install the host_alerts units
  template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - host-alerts-follow.service
    - host-alerts-check.service
    - host-alerts-check.timer
    - host-alerts-digest.service
    - host-alerts-digest.timer
  register: host_alerts_units
  notify: Restart host-alerts-follow

- name: Reload systemd after unit changes
  when: host_alerts_units is changed
  systemd:
    daemon_reload: true

- name: Enable and start the follower and the timers
  systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - host-alerts-follow.service
    - host-alerts-check.timer
    - host-alerts-digest.timer

- name: Set up SMART monitoring (smartd)
  when: host_alerts_smart | bool
  block:
    - name: Install smartmontools
      apt:
        name: smartmontools
        state: present

    - name: Install the smartd alert hook
      template:
        src: smartd-notify.sh.j2
        dest: /usr/local/sbin/smartd-fleet-notify
        owner: root
        group: root
        mode: "0755"

    - name: Configure smartd (all drives; self-tests; temperature; alerts)
      copy:
        dest: /etc/smartd.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # {{ ansible_managed | default('Managed by Ansible (host_alerts)') }}
          DEVICESCAN -a -o on -S on -n standby,q -s (S/../.././02|L/../../6/03) -W 4,50,60 -m root -M exec /usr/local/sbin/smartd-fleet-notify
      notify: Restart smartd

    - name: Enable smartd
      systemd:
        name: smartmontools.service
        enabled: true
        state: started

- name: Flush handlers (follower restarted on changes before the gate)
  meta: flush_handlers

- name: Gate - the follower is running
  systemd:
    name: host-alerts-follow.service
  register: host_alerts_follow_state
  retries: 5
  delay: 2
  until: host_alerts_follow_state.status.ActiveState | default('') == 'active'

- name: Record the integrity baselines on first install
  command: /usr/local/sbin/host-alerts-check check
  args:
    creates: "{{ host_alerts_state_dir }}/baseline.crown"
