---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
provisioner:
  name: ansible
  inventory:
    host_vars:
      instance:
        ansible_python_interpreter: /usr/bin/python3
        automation_user: ansible
        internal_dns_enabled: true
        internal_dns_domain: exnada.com
        internal_dns_private_hosts:
          - mpnas
          - aispector
          - callosal
          - dev
        # Test the DNS logic without real Tailscale: the Corefile falls back to
        # tailscale_ip for each host, so no tailscale up / status is needed.
        enable_tailscale: false
        tailscale_ip: "100.64.0.1"
verifier:
  name: ansible
