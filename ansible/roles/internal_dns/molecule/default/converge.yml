---
- name: Converge
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: docker_host
      vars:
        enable_docker: true
    # tailscale role omitted: enable_tailscale is false, and internal_dns's
    # Corefile falls back to the tailscale_ip variable for every host.
    - role: internal_dns
      vars:
        tailscale_ip: "100.64.0.1"
