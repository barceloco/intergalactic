---
# Validation tasks for CoreDNS.
#
# A changed Corefile is loaded by the reload plugin within
# internal_dns_reload_interval (plus jitter), without a restart; the reload
# also starts a fresh cache, so a just-added name is not held back by a cached
# NXDOMAIN. So: wait until every internal host resolves, then assert each one.
# A Corefile that CoreDNS rejects keeps the old one serving, and the new
# names never resolve: the play fails here.

- name: Wait for CoreDNS to be ready
  wait_for:
    port: 53
    host: 127.0.0.1
    delay: 2
    timeout: 30
    msg: "CoreDNS is not listening on port 53"

- name: Test DNS resolution of internal domain
  command: dig @127.0.0.1 +timeout=5 +tries=2 {{ internal_dns_domain }}
  register: dns_test_result
  changed_when: false
  failed_when: false

- name: Validate DNS resolution succeeded
  assert:
    that:
      - dns_test_result.rc == 0
      - dns_test_result.stdout is search('NOERROR')
    fail_msg: |
      ============================================================================
      ERROR: DNS resolution test failed!
      ============================================================================
      CoreDNS is running but cannot resolve {{ internal_dns_domain }}.

      Test output: {{ dns_test_result.stdout | default('empty') }}
      ============================================================================
    success_msg: "DNS resolution test passed for {{ internal_dns_domain }}"

# One command per attempt checks every host, so the wait covers the reload
# interval once, not once per host.
- name: Wait until every internal host resolves (Corefile reload)
  when: internal_dns_private_hosts | default([]) | length > 0
  shell: |
    set -euo pipefail
    for h in {{ internal_dns_private_hosts | map('regex_replace', '$', '.' ~ internal_dns_domain) | join(' ') }}; do
      dig @127.0.0.1 +timeout=3 +tries=1 +noall +comments "$h" | grep -q 'status: NOERROR' || { echo "$h"; exit 1; }
    done
  args:
    executable: /bin/bash
  register: coredns_wait_all
  until: coredns_wait_all.rc == 0
  retries: 15
  delay: 3
  changed_when: false
  failed_when: false

- name: Test DNS resolution of internal hosts
  when: internal_dns_private_hosts | default([]) | length > 0
  command: dig @127.0.0.1 +timeout=5 +tries=2 {{ item }}.{{ internal_dns_domain }}
  register: host_dns_test_result
  changed_when: false
  failed_when: false
  loop: "{{ internal_dns_private_hosts }}"

- name: Validate internal host DNS resolution
  when: internal_dns_private_hosts | default([]) | length > 0
  assert:
    that:
      - item.stdout is search('NOERROR')
    fail_msg: |
      ============================================================================
      ERROR: DNS resolution failed for {{ item.item }}.{{ internal_dns_domain }}
      (after waiting for the Corefile reload)!
      ============================================================================
      If CoreDNS rejected the new Corefile, it keeps serving the old one: check
      docker logs {{ internal_dns_container_name }}
      Test output: {{ item.stdout | default('empty') }}
      ============================================================================
    success_msg: "DNS resolution test passed for {{ item.item }}.{{ internal_dns_domain }}"
  loop: "{{ host_dns_test_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
