---
# Validation tasks for CoreDNS
# These tasks verify that CoreDNS is actually working after deployment

- name: Wait for CoreDNS to be ready
  when: internal_dns_enabled | default(false)
  wait_for:
    port: 53
    host: 127.0.0.1
    delay: 2
    timeout: 30
    msg: "CoreDNS is not listening on port 53"

- name: Test DNS resolution of internal domain
  when: internal_dns_enabled | default(false)
  command: dig @127.0.0.1 +timeout=5 +tries=2 {{ internal_dns_domain }}
  register: dns_test_result
  changed_when: false
  failed_when: false

- name: Validate DNS resolution succeeded
  when: internal_dns_enabled | default(false)
  assert:
    that:
      - dns_test_result.rc == 0
      - dns_test_result.stdout is search('NOERROR')
    fail_msg: |
      ============================================================================
      ERROR: DNS resolution test failed!
      ============================================================================
      CoreDNS is running but cannot resolve {{ internal_dns_domain }}.

      Test output: {{ dns_test_result.stdout | default('empty') }}

      Please check:
      1. DNS zone file is correct: {{ internal_dns_data_dir }}/db.{{ internal_dns_domain }}
      2. CoreDNS logs: docker logs {{ internal_dns_container_name }}
      3. Corefile configuration: {{ internal_dns_data_dir }}/Corefile
      ============================================================================
    success_msg: "✓ DNS resolution test passed for {{ internal_dns_domain }}"

- name: Test DNS resolution of internal hosts
  when:
    - internal_dns_enabled | default(false)
    - internal_dns_private_hosts is defined
    - internal_dns_private_hosts | length > 0
  command: dig @127.0.0.1 +timeout=5 +tries=2 {{ item }}.{{ internal_dns_domain }}
  register: host_dns_test_result
  changed_when: false
  failed_when: false
  loop: "{{ internal_dns_private_hosts }}"

- name: Validate internal host DNS resolution
  when:
    - internal_dns_enabled | default(false)
    - internal_dns_private_hosts is defined
    - internal_dns_private_hosts | length > 0
  assert:
    that:
      - item.rc == 0
      - item.stdout is search('NOERROR')
    fail_msg: |
      ============================================================================
      ERROR: DNS resolution failed for {{ item.item }}.{{ internal_dns_domain }}!
      ============================================================================
      CoreDNS cannot resolve this internal host.

      Test output: {{ item.stdout | default('empty') }}

      Please check:
      1. Host is in DNS zone file: {{ internal_dns_data_dir }}/db.{{ internal_dns_domain }}
      2. Host IP mapping is correct
      3. CoreDNS logs: docker logs {{ internal_dns_container_name }}
      ============================================================================
    success_msg: "✓ DNS resolution test passed for {{ item.item }}.{{ internal_dns_domain }}"
  loop: "{{ host_dns_test_result.results | default([]) }}"
