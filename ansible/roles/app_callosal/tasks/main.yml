---
# Deploy/run callosal via its own Makefile. Runs as the deploy user (owns
# /srv/callosal, in the docker group). The repo is only pulled (read). callosal's
# SQLite DB lives inside the checkout at annotations/ and is gitignored, so a pull
# cannot touch it, and this role never runs callosal-clean or callosal-db-reset.
- name: Check the deploy user exists (created by docker_deploy)
  when: callosal_enabled | default(false)
  become: true
  command: id deploy
  register: callosal_deploy_user
  changed_when: false
  failed_when: false

- name: Fail with guidance if the deploy user is missing
  when: callosal_enabled | default(false)
  assert:
    that:
      - callosal_deploy_user.rc == 0
    fail_msg: |
      ============================================================================
      ERROR: the 'deploy' user does not exist.
      ============================================================================
      The callosal role runs as the 'deploy' user, created by the docker_deploy
      role. Set enable_docker_deploy: true for this host and ensure the production
      deploy runs docker_deploy first (it is ordered before app roles).
      ============================================================================
    success_msg: "✓ deploy user present"

- name: Deploy callosal service
  when: callosal_enabled | default(false)
  become: true
  become_user: deploy
  block:
    - name: Ensure callosal repo present at the configured ref (pull only)
      git:
        repo: "{{ callosal_repo_url }}"
        dest: "{{ callosal_dir }}"
        version: "{{ callosal_repo_ref }}"
        update: true
      register: callosal_repo

    - name: Describe the deployed callosal commit against the nearest tag  # noqa: command-instead-of-module
      command: git describe --tags
      args:
        chdir: "{{ callosal_dir }}"
      register: callosal_tag
      changed_when: false
      failed_when: false
      # git describe shows the nearest tag and distance (or just the tag when
      # exactly on it); empty when the history has no tags.

    - name: Check whether the callosal container is already running
      command: docker ps -q --filter "name=^{{ callosal_container_name }}$" --filter status=running
      register: callosal_running
      changed_when: false

    - name: Decide whether callosal needs a (re)deploy
      set_fact:
        # Redeploy only when the checked-out code changed or the container is not
        # up. A pull that returns the same commit against a running container is a
        # true no-op: no rebuild, no restart.
        callosal_redeploy: "{{ callosal_repo.changed or (callosal_running.stdout | trim) == '' }}"

    - name: Build the callosal image (make callosal-build)
      command: make callosal-build
      args:
        chdir: "{{ callosal_dir }}"
      when: callosal_redeploy | bool
      changed_when: true

    - name: Stop the running callosal container before restart (safe if absent)
      command: make callosal-serve-stop
      args:
        chdir: "{{ callosal_dir }}"
      when: callosal_redeploy | bool
      changed_when: true
      failed_when: false

    - name: Start callosal (make callosal-serve-detached)
      command: make callosal-serve-detached
      args:
        chdir: "{{ callosal_dir }}"
      when: callosal_redeploy | bool
      changed_when: true

    - name: Verify the callosal container is running
      command: docker ps -q --filter "name=^{{ callosal_container_name }}$" --filter status=running
      register: callosal_verify
      changed_when: false
      failed_when: (callosal_verify.stdout | trim) == ''

- name: Publish callosal deployment provenance (app_build_info for Prometheus)
  when:
    - callosal_enabled | default(false)
    - node_exporter_enabled | default(false)
    - callosal_repo.after is defined
  become: true
  copy:
    dest: "{{ node_exporter_textfile_dir | default('/var/lib/prometheus/node-exporter') }}/callosal.prom"
    mode: '0644'
    content: |
      # HELP app_build_info Repo, branch, and commit ansible deployed per app.
      # TYPE app_build_info gauge
      app_build_info{app="callosal",route="{{ callosal_route | default('') }}",repo="{{ callosal_repo_url | regex_replace('\.git$', '') | regex_replace('^https?://[^/]+/', '') | regex_replace('^[^@/]+@[^:/]+:', '') }}",branch="{{ callosal_repo_ref }}",commit="{{ callosal_repo.after }}",tag="{{ (callosal_tag.stdout_lines | first | default('')) if callosal_tag is defined else '' }}"} 1
  # Runs as root (outside the deploy block) to write node_exporter's textfile dir,
  # so callosal's repo/branch/commit surfaces in the monitor provenance table.
